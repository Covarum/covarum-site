name: Verify live search discovery and notify IndexNow
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - '.github/workflows/search-discovery.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: covarum-search-discovery
  cancel-in-progress: true
jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify the exact live release, then notify participating search engines
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          SITE = 'https://www.covarum.com'
          KEY = '3c9a5760908da7cd6348f97937c4acf7'
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.meta = {}; self.canonical = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'meta': self.meta[a.get('name', '')] = a.get('content', '')
                  if tag == 'link' and a.get('rel') == 'canonical': self.canonical = a.get('href')
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Covarum-Release-Verification/1.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  if urllib.parse.urlsplit(response.url).hostname != 'www.covarum.com':
                      raise RuntimeError('Unexpected redirect origin')
                  return response.read().decode('utf-8'), response.headers
          for attempt in range(18):
              try:
                  home, _ = get(SITE + '/')
                  parsed = Page(); parsed.feed(home)
                  if parsed.meta.get('covarum-source-revision') == os.environ['EXPECTED_SHA']:
                      break
              except Exception as exc:
                  print('Release not yet verifiable:', type(exc).__name__)
              if attempt == 17: raise RuntimeError('Expected production commit did not become live; no URLs submitted')
              time.sleep(15)
          robots, _ = get(SITE + '/robots.txt')
          for bot in ['OAI-SearchBot', 'Claude-SearchBot', 'Claude-User', 'PerplexityBot']:
              if bot not in robots: raise RuntimeError('Missing crawler policy: ' + bot)
          sitemap, _ = get(SITE + '/sitemap.xml')
          urls = [node.text for node in ET.fromstring(sitemap).findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          if SITE + '/questions' not in urls or not 1 <= len(urls) <= 100:
              raise RuntimeError('Unexpected public sitemap')
          for url in urls:
              parts = urllib.parse.urlsplit(url)
              if parts.scheme != 'https' or parts.netloc != 'www.covarum.com' or parts.query or parts.fragment:
                  raise RuntimeError('URL outside the intended public site')
              body, headers = get(url)
              page = Page(); page.feed(body)
              if 'noindex' in (headers.get('X-Robots-Tag', '') + page.meta.get('robots', '')).lower():
                  raise RuntimeError('Public sitemap contains a noindex page')
              if parts.path in ['/questions', '/solutions/life-insurance'] and page.canonical != url:
                  raise RuntimeError('Canonical mismatch: ' + url)
              print('Live HTTP 200:', url)
          key_text, _ = get(SITE + '/' + KEY + '.txt')
          if key_text.strip() != KEY: raise RuntimeError('Hosted IndexNow verification does not match')
          payload = json.dumps({'host': 'www.covarum.com', 'key': KEY, 'keyLocation': SITE + '/' + KEY + '.txt', 'urlList': urls}).encode()
          request = urllib.request.Request('https://api.indexnow.org/indexnow', data=payload, headers={'Content-Type': 'application/json; charset=utf-8'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              status = response.status
              if status not in [200, 202]: raise RuntimeError('Unexpected IndexNow status: ' + str(status))
          result = 'URLs received; ownership validation pending' if status == 202 else 'URLs received successfully'
          summary = f'Production {os.environ["EXPECTED_SHA"]}: {len(urls)} public URLs verified. IndexNow HTTP {status}: {result}. This is not proof of indexing, ranking or AI citations. Google Search Console submission is separate.'
          print(summary)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as file: file.write(summary + '\n')
          PY
